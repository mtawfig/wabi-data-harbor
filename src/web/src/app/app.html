<main class="shell">
  <section class="shell__card">
    <p class="shell__eyebrow">Wabitex · AP-AIR</p>
    <h1 class="shell__title">{{ productName() }}</h1>
    <p class="shell__tagline">{{ tagline() }}</p>
    <p class="shell__status" [attr.data-status]="apiStatus()">
      @switch (apiStatus()) {
        @case ('checking') {
          Checking API…
        }
        @case ('online') {
          API online · version {{ info()?.version }}
        }
        @case ('offline') {
          API offline
        }
      }
    </p>
  </section>
  <router-outlet />
</main>

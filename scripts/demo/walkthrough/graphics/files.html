<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Files created by Wabi Insight</title>
<link rel="stylesheet" href="base.css">
<style>
  .stage { justify-content: flex-start; padding-top: 70px; }
  .row { display: flex; gap: 70px; margin-top: 46px; align-items: flex-start; }
  .file { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .paper { position: relative; width: 470px; height: 640px; }
  .paper img { position: absolute; inset: 0; width: 470px; height: 640px; object-fit: cover; object-position: top; background: #fff; border-radius: 10px; box-shadow: 0 30px 70px rgb(0 0 0 / 45%); }
  .paper img.back { transform: rotate(-6deg) translate(-26px, 14px); filter: brightness(.86); }
  .paper img.back2 { transform: rotate(5deg) translate(24px, 10px); filter: brightness(.8); }
  .file.in .paper { animation: float 6s ease-in-out infinite alternate; }
  @keyframes float { to { transform: translateY(-14px); } }
  .badge { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 999px; font: 700 26px/1 Inter; }
  .pdf { background: rgb(229 72 77 / 22%); border: 1px solid rgb(229 72 77 / 55%); }
  .docx { background: rgb(43 109 212 / 25%); border: 1px solid rgb(90 150 240 / 55%); }
  .xlsx { background: rgb(33 163 102 / 22%); border: 1px solid rgb(60 200 130 / 55%); }
  .badge .material-icons { font-size: 30px; }
</style></head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div><div class="grid"></div>
  <div class="stage">
    <div class="eyebrow" data-beat="0">Real files, generated from verified data</div>
    <h2 data-beat="0" style="--i:1">Reports your people <span class="grad">can use</span></h2>
    <div class="row">
      <div class="file" data-beat="0" style="--i:2">
        <div class="paper"><img class="back2" src="files/pdf-3.png" alt=""><img class="back" src="files/pdf-2.png" alt=""><img src="files/pdf-1.png" alt=""></div>
        <span class="badge pdf"><span class="material-icons">picture_as_pdf</span>PDF study</span>
      </div>
      <div class="file" data-beat="0" style="--i:4">
        <div class="paper"><img src="files/docx-1.png" alt=""></div>
        <span class="badge docx"><span class="material-icons">description</span>Word document</span>
      </div>
      <div class="file" data-beat="0" style="--i:6">
        <div class="paper"><img src="files/xlsx-1.png" alt=""></div>
        <span class="badge xlsx"><span class="material-icons">table_view</span>Excel workbook</span>
      </div>
    </div>
  </div>
  <script src="stage.js"></script>
</body></html>

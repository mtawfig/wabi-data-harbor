<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>وابي تكس سوليوشنز</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="base-ar.css">
<style>
  .mark { width: 820px; filter: drop-shadow(0 20px 60px rgb(34 184 207 / 35%)); }
  .name { font: 700 52px/1.2 sans-serif; margin-top: 18px; }
  .pillars { display: flex; gap: 22px; margin-top: 46px; }
  .contact { margin-top: 56px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .contact .cta { font: 700 54px/1.35 sans-serif; text-align: center; }
  .contact .links { display: flex; gap: 22px; }
  .contact .links .chip { font-size: 32px; padding: 18px 30px; }
</style></head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div><div class="grid"></div>
  <div class="stage">
    <img class="mark" data-beat="0" src="__WEB__/public/brand/wabi-insight-wordmark-light.svg" alt="Wabi Insight">
    <div class="name" data-beat="0" style="--i:1">وابي إنسايت</div>
    <div class="pillars" data-stagger>
      <span class="chip" data-beat="0" style="--i:2"><span class="material-icons">task_alt</span>إجابات موثّقة</span>
      <span class="chip" data-beat="0" style="--i:3"><span class="material-icons">dashboard</span>لوحات وتقارير</span>
      <span class="chip" data-beat="0" style="--i:4"><span class="material-icons">notifications_active</span>تنبيهات استباقية</span>
      <span class="chip" data-beat="0" style="--i:5"><span class="material-icons">shield</span>أمان مدمج</span>
      <span class="chip" data-beat="0" style="--i:6"><span class="material-icons">translate</span>العربية والإنجليزية</span>
    </div>
    <div class="contact">
      <div class="cta" data-beat="1">تواصل مع <span class="grad">وابي تكس سوليوشنز</span><br>لعرض تجريبي على بياناتك</div>
      <div class="links">
        <span class="chip ltr" data-beat="1" style="--i:2"><span class="material-icons">language</span>__WEBSITE__</span>
        <span class="chip ltr" data-beat="1" style="--i:3"><span class="material-icons">mail</span>__EMAIL__</span>
      </div>
    </div>
  </div>
  <script src="stage.js"></script>
</body></html>

<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>وابي إنسايت</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="base-ar.css">
<style>
  .chaos { display: grid; grid-template-columns: 620px 1fr; gap: 90px; align-items: center; }
  .chaos img { width: 620px; filter: drop-shadow(0 30px 60px rgb(0 0 0 / 35%)); }
  .chaos h2 { text-align: start; font-size: 76px; }
  .chaos .lead { text-align: start; margin-top: 30px; }
  .tags { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 40px; }
  .hero { text-align: center; }
  .hero .mark { width: 1000px; filter: drop-shadow(0 20px 70px rgb(34 184 207 / 40%)); }
  .hero .name { font: 700 64px/1.2 sans-serif; margin-top: 30px; }
  .hero .tagline { font: 700 54px/1.3 sans-serif; margin-top: 22px; }
  .hero .by { margin-top: 30px; font: 600 30px/1.2 sans-serif; color: var(--muted); }
  .hero .by b { color: var(--white); }
  .pulse { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; border: 2px solid rgb(34 184 207 / 30%); left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.2); opacity: 0; }
  body[data-step="1"] .pulse { animation: pulse 3.2s var(--ease) .2s 2; }
  body[data-step="1"] .pulse.two { animation-delay: 1.2s; }
  @keyframes pulse { 0% { opacity: .9; transform: translate(-50%, -50%) scale(.15); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }
</style></head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div><div class="grid"></div>
  <div class="layer">
    <div class="chaos">
      <img data-beat="0" data-until="1" src="__WEB__/public/illustrations/data-chaos.svg" alt="">
      <div>
        <h2 data-beat="0" data-until="1" style="--i:1">إجاباتك <span class="grad">متفرقة</span> بين الأنظمة.</h2>
        <p class="lead" data-beat="0" data-until="1" style="--i:2">التقارير تستغرق أيامًا، والأسئلة تنتظر دورها.</p>
        <div class="tags" data-stagger>
          <span class="chip" data-beat="0" data-until="1"><span class="material-icons">storage</span>الأنظمة الأساسية</span>
          <span class="chip" data-beat="0" data-until="1"><span class="material-icons">table_view</span>جداول البيانات</span>
          <span class="chip" data-beat="0" data-until="1"><span class="material-icons">mail</span>طلبات بالبريد</span>
          <span class="chip" data-beat="0" data-until="1"><span class="material-icons">hourglass_top</span>انتظار</span>
        </div>
      </div>
    </div>
  </div>
  <div class="pulse"></div><div class="pulse two"></div>
  <div class="layer hero">
    <img class="mark" data-beat="1" src="__WEB__/public/brand/wabi-insight-wordmark-light.svg" alt="Wabi Insight">
    <div class="name" data-beat="1" style="--i:2">وابي إنسايت</div>
    <div class="tagline" data-beat="1" style="--i:3">اسأل بياناتك. <span class="grad">وثِق بالإجابة.</span></div>
    <div class="by" data-beat="1" style="--i:6">من <b>وابي تكس سوليوشنز</b></div>
  </div>
  <script src="stage.js"></script>
</body></html>

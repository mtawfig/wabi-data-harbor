<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WabiTex Solutions</title>
<link rel="stylesheet" href="base.css">
<style>
  .mark { width: 860px; filter: drop-shadow(0 20px 60px rgb(34 184 207 / 35%)); }
  .pillars { display: flex; gap: 22px; margin-top: 54px; }
  .contact { margin-top: 64px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .contact .cta { font: 800 54px/1.15 Inter; text-align: center; }
  .contact .links { display: flex; gap: 22px; }
  .contact .links .chip { font-size: 32px; padding: 18px 30px; }
</style></head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div><div class="grid"></div>
  <div class="stage">
    <img class="mark" data-beat="0" src="__WEB__/public/brand/wabi-insight-wordmark-light.svg" alt="Wabi Insight">
    <div class="pillars" data-stagger>
      <span class="chip" data-beat="0" style="--i:2"><span class="material-icons">task_alt</span>Verified answers</span>
      <span class="chip" data-beat="0" style="--i:3"><span class="material-icons">dashboard</span>Dashboards &amp; reports</span>
      <span class="chip" data-beat="0" style="--i:4"><span class="material-icons">notifications_active</span>Proactive alerts</span>
      <span class="chip" data-beat="0" style="--i:5"><span class="material-icons">shield</span>Secure by design</span>
      <span class="chip" data-beat="0" style="--i:6"><span class="material-icons">translate</span>English &amp; Arabic</span>
    </div>
    <div class="contact">
      <div class="cta" data-beat="1">Contact <span class="grad">WabiTex Solutions</span><br>for a demo on your data</div>
      <div class="links">
        <span class="chip" data-beat="1" style="--i:2"><span class="material-icons">language</span>__WEBSITE__</span>
        <span class="chip" data-beat="1" style="--i:3"><span class="material-icons">mail</span>__EMAIL__</span>
      </div>
    </div>
  </div>
  <script src="stage.js"></script>
</body></html>

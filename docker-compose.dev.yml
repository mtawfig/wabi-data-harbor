# Local development dependencies for Wabi Insight.
# Usage: docker compose -f docker-compose.dev.yml up -d
# The SA password below is for local development only and matches appsettings.Development.json.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wabi-insight-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "WabiInsight_Dev_2026!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - wabi-insight-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'WabiInsight_Dev_2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  wabi-insight-mssql:

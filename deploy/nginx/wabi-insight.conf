# Linux host deployment: nginx serves the Angular build from /var/www/wabi-insight and proxies the API
# (Kestrel on 127.0.0.1:5080, systemd unit deploy/systemd/wabi-insight-api.service). Replace the certificate
# paths with your own (or let certbot manage this block).
server {
    listen 80;
    server_name insight.example.com;
    # Let's Encrypt HTTP-01 challenges (certbot --webroot -w /var/www/letsencrypt) must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name insight.example.com;

    ssl_certificate     /etc/letsencrypt/live/insight.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insight.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/wabi-insight;
    index index.html;
    client_max_body_size 12m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location /health/ {
        proxy_pass http://127.0.0.1:5080/health/;
    }

    location ~* \.(?:js|css|woff2?|png|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # "expires -1" sends Cache-Control: no-cache without an add_header here: a location with its own add_header
        # would drop the server-level security headers above (CSP, frame and HSTS) from the application shell.
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

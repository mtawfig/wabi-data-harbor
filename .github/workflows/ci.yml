name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "wi/**", "claude/**"]
  workflow_dispatch: # run the checks on any branch from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  api:
    name: API (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "WabiInsight_Ci_2026!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'WabiInsight_Ci_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      # Used by integration tests from P1.2 onward. Not a real credential.
      WI_TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=WabiInsightTests;User Id=sa;Password=WabiInsight_Ci_2026!;TrustServerCertificate=True;Encrypt=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore WabiInsight.slnx
      - name: Build
        run: dotnet build WabiInsight.slnx --configuration Release --no-restore
      - name: Dependency audit (NuGet)
        run: |
          dotnet list WabiInsight.slnx package --vulnerable --include-transitive > nuget-audit.txt
          cat nuget-audit.txt
          ! grep -Eq "has the following vulnerable packages" nuget-audit.txt
      - name: Test
        run: >-
          dotnet test WabiInsight.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: TestResults

  # The first servers run Windows (IIS), and everything above runs on Linux. This job builds the solution and runs the
  # unit tests on Windows, where paths, regional formats, time zone names and the PDF library's native files differ.
  # The integration tests stay on Linux: they need SQL Server in a container, which Windows runners do not offer.
  api-windows:
    name: API on Windows (unit tests)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore WabiInsight.slnx
      - name: Build
        run: dotnet build WabiInsight.slnx --configuration Release --no-restore
      - name: Test (unit)
        run: >-
          dotnet test tests/WabiInsight.UnitTests --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-windows-test-results
          path: TestResults

  oracle:
    # Oracle end to end (P13.30) in its own job: SQL Server, Oracle and the whole integration suite together do not fit
    # a standard runner. Here SQL Server is capped and only the Oracle tests run.
    name: Oracle (end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "WabiInsight_Ci_2026!"
          MSSQL_PID: Developer
          MSSQL_MEMORY_LIMIT_MB: "2048"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'WabiInsight_Ci_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: "WabiOracle_Ci_2026"
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    env:
      # Not real credentials: the CI service containers above. The Oracle tests create their own schema and read-only login.
      WI_TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=WabiInsightOracleTests;User Id=sa;Password=WabiInsight_Ci_2026!;TrustServerCertificate=True;Encrypt=True"
      WI_TEST_ORACLE_CONNECTION: "User Id=system;Password=WabiOracle_Ci_2026;Data Source=localhost:1521/FREEPDB1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore tests/WabiInsight.IntegrationTests
      - name: Build
        run: dotnet build tests/WabiInsight.IntegrationTests --configuration Release --no-restore
      - name: Test (Oracle)
        run: >-
          dotnet test tests/WabiInsight.IntegrationTests --configuration Release --no-build
          --filter "FullyQualifiedName~Oracle"
          --logger "trx;LogFileName=oracle.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-test-results
          path: TestResults

  web:
    name: Web (Angular 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Dependency audit (npm, production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        run: npm test
      - name: Build
        run: npm run build -- --configuration production

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f src/WabiInsight.Api/Dockerfile -t wabi-insight-api:ci .
      - name: Build web image
        run: docker build -f src/web/Dockerfile -t wabi-insight-web:ci src/web
      - name: Smoke-start the API image
        run: |
          docker run -d --name api -e ConnectionStrings__ConfigurationDatabase="Server=none;Database=x;User Id=x;Password=x;Encrypt=True;TrustServerCertificate=True;" -p 8080:8080 wabi-insight-api:ci
          for _ in $(seq 1 20); do if curl -fsS http://localhost:8080/health/live; then break; fi; sleep 2; done
          curl -fsS http://localhost:8080/health/live
          docker logs api | tail -20
          docker rm -f api
      # The whole server stack of docs/DEPLOYMENT_LINUX_DOCKER.md, exactly as a server runs it: wabi-docker install, init,
      # deploy, bootstrap, sign-in through HTTPS (Caddy's local certificate for "localhost"), backup and restore.
      - name: Docker server stack (wabi-docker)
        env:
          ADMIN_PASSWORD: "Ci#Docker#Admin#2026" # not a real credential: a throw-away CI database
        run: |
          set -euo pipefail
          docker tag wabi-insight-api:ci local/wabi-insight-api:ci
          docker tag wabi-insight-web:ci local/wabi-insight-web:ci
          sudo bash deploy/docker/server/wabi-docker.sh install "$GITHUB_WORKSPACE"
          sudo sed -i 's/^WI_DOMAIN=.*/WI_DOMAIN=localhost/; s/^WI_ACME_EMAIL=.*/WI_ACME_EMAIL=ci@example.com/; s#^WI_REGISTRY=.*#WI_REGISTRY=local#' /opt/wabi-insight/.env
          sudo wabi-docker init
          sudo wabi-docker deploy ci --no-pull
          curl -fsSk https://localhost/health/ready | grep '"status":"Healthy"' > /dev/null
          curl -fsSk https://localhost/ | grep '<app-root' > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/login)" = 308
          sudo WI_BOOTSTRAP_EMAIL=ci.admin@wabi.test WI_BOOTSTRAP_PASSWORD="$ADMIN_PASSWORD" wabi-docker bootstrap < /dev/null
          sign_in() {
            rm -f cookies.txt
            token=$(curl -fsSk -c cookies.txt https://localhost/api/auth/csrf | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
            curl -fsSk -b cookies.txt -c cookies.txt -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
              -d "{\"email\":\"ci.admin@wabi.test\",\"password\":\"$ADMIN_PASSWORD\"}" https://localhost/api/auth/login | grep '"principalType":"PlatformAdministrator"' > /dev/null
          }
          sign_in
          sudo wabi-docker backup --no-upload
          backup=$(sudo ls -1t /opt/wabi-insight/backups | grep -m1 '^wabi-backup-')
          sudo wabi-docker restore "$backup"
          curl -fsSk https://localhost/health/ready | grep '"status":"Healthy"' > /dev/null
          sign_in
          sudo wabi-docker status
      - name: Docker server stack logs
        if: failure()
        run: sudo docker compose --project-name wabi-insight --project-directory /opt/wabi-insight -f /opt/wabi-insight/compose.yaml logs --tail 80 || true
